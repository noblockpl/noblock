<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Geo Map - Warszawa (0,0)</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicjalizacja mapy świata ze środkiem w Warszawie
        var map = L.map('map').setView([52.23195, 21.00600], 6);

        // 2. Dodanie prawdziwej mapy świata jako podkładu (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Nałożenie mapy Minecrafta jako warstwy (Overlay)
        // Musisz dopasować współrzędne graniczne (bounds) tak, aby środek (0,0) wypadał w Warszawie,
        // a rozmiar odpowiadał skali Twoich kafelków z Dynmapy.
        var minecraftBounds = [
            [50.0, 18.0], // Południowo-zachodni narożnik świata MC
            [54.0, 24.0]  // Północno-wschodni narożnik świata MC
        ];

        var minecraftOverlay = L.imageOverlay('sciezka_do_zrenderowanego_obrazu.png', minecraftBounds, {
            opacity: 0.7, // Przezroczystość, żeby widzieć pod spodem prawdziwą mapę
            interactive: true
        }).addTo(map);

        // Opcjonalnie: Dodanie markerów graczy pobieranych z API serwera
    </script>
</script>
</body>
</html>
